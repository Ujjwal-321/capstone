<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MoodCapsule</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="MoodCapsule – one emoji, one sentence. Look back on your days, your patterns and your time capsules." />
  <meta name="theme-color" content="#7C6CF2" />
  <link rel="icon" type="image/svg+xml" href="assets/brand/moodcapsule-icon.svg" />
  <link rel="preload" href="assets/fonts/Poppins-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="assets/fonts/Poppins-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
  <script>
    // Apply the saved theme before Angular starts, so dark mode doesn't flash white.
    (function () {
      try {
        var pref = localStorage.getItem('mc_theme') || 'SYSTEM';
        var dark = pref === 'DARK' || (pref === 'SYSTEM' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
