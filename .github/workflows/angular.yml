name: Angular Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  angular-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Angular CLI 21
        run: npm install -g @angular/cli@21

      - name: Build Angular application
        run: ng build
        
